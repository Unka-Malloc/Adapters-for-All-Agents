# Generated release train for Adapter-For-All-Agents.
# Edit the release declaration and regenerate instead of changing this file
# by hand.
#
# Three ways to release, one pipeline:
#
# - Weekly train: every Fri through 23:59 UTC+08:00 (Asia/Shanghai). The candidate
#   is the last commit merged into `nightly` (the default branch until the
#   repository adopts `nightly`) before the cutoff. The bump is the highest
#   `release:patch`, `release:minor` or `release:major` label among its pull
#   requests, patch when none is set. The train runs as a rehearsal.
# - Run workflow: releases the head of `nightly` (or the requested commit)
#   now, at the version typed in or bumped by the chosen level.
# - Tag push: pushing `v<version>` publishes that commit; its manifests must
#   already carry that version.
#
# A candidate identical to the last published release is skipped. A failed
# step stops the run until a person reruns it; a rerun finishes a partly
# uploaded version instead of skipping past it.
#
# Two jobs share the steps. `rehearse` holds a read-only token: it selects,
# verifies, versions and packages, and never pushes, tags or uploads.
# `release` additionally moves `stable` to the candidate, publishes to
# crates.io, tags the release on `release` with a GitHub release, and merges
# it back into `nightly`.
#
# Credentials: crates.io Trusted Publishing; no stored secret.
name: publish

on:
  schedule:
    - cron: "0 16 * * 5"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish, such as 0.3.0; empty bumps by level
        required: false
        default: ""
      level:
        description: Bump level when no version is given
        type: choice
        options: [patch, minor, major]
        default: patch
      candidate:
        description: Commit or branch to release; empty takes the head of nightly
        required: false
        default: ""
      rehearse:
        description: Rehearse only; nothing is pushed, tagged or uploaded
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  rehearse:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearse) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: read
    env:
      RELEASE_MODE: dry-run
      RELEASE_KIND: ${{ github.event_name == 'schedule' && 'train' || github.event_name == 'push' && 'tag' || 'manual' }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_LEVEL: ${{ inputs.level }}
      SIBLINGS: '[]'
    defaults:
      run:
        shell: bash
        working-directory: Adapter-For-All-Agents
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Adapter-For-All-Agents
          fetch-depth: 0

      # Copied before the candidate checkout replaces the working tree, so the
      # helper always matches this workflow.
      - name: Stage the train helper
        run: cp .github/release-train.py "$RUNNER_TEMP/train.py"

      - name: Select the candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.candidate }}
        run: |
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          python3 "$RUNNER_TEMP/train.py" candidate --weekday=fri --time=23:59 \
            --utc-offset=+08:00 --default-branch="$default_branch" --override="$OVERRIDE"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install the pinned toolchain
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install
          fi

      - name: Wait for cross-repository dependencies
        id: deps
        run: python3 "$RUNNER_TEMP/train.py" deps --wait-minutes=0

      - name: Compute the release version
        id: version
        if: steps.deps.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: python3 "$RUNNER_TEMP/train.py" version --candidate="$CANDIDATE" --branch="$BRANCH"

      - name: Verify
        if: steps.version.outputs.release == 'true'
        run: |
          scripts/verify.sh

      - name: Native-capability freshness
        if: steps.version.outputs.release == 'true'
        run: python3 "$RUNNER_TEMP/train.py" freshness --window-days=14

      - name: Apply the release version
        if: steps.version.outputs.release == 'true' && steps.version.outputs.needs_set == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          cargo install cargo-edit@0.13.13 --locked --no-default-features --features set-version
          cargo set-version --workspace "$NEXT"
          cargo update --workspace

      - name: Package
        if: steps.version.outputs.release == 'true'
        env:
          EXCLUDES: ${{ steps.version.outputs.excludes }}
        run: |
          args=()
          for crate in $EXCLUDES; do args+=(--exclude "$crate"); done
          cargo publish --workspace --dry-run --allow-dirty "${args[@]}"

      - name: Promote the candidate to stable
        if: >-
          env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
          && env.RELEASE_KIND != 'tag'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git push origin "$CANDIDATE:refs/heads/stable"
          if ! git diff --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "release: v$NEXT"
          fi

      - name: Authenticate to crates.io
        id: auth
        if: env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDES: ${{ steps.version.outputs.excludes }}
        run: |
          args=()
          for crate in $EXCLUDES; do args+=(--exclude "$crate"); done
          cargo publish --workspace "${args[@]}"

      - name: Tag the release
        if: env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if [ "$RELEASE_KIND" != tag ]; then
            git tag "v$NEXT"
            git push origin "refs/tags/v$NEXT"
          fi
          if ! git push origin "HEAD:refs/heads/release"; then
            # A hand-pushed tag may sit off the release line; the upload
            # already happened, so only the branch pointer is left behind.
            [ "$RELEASE_KIND" = tag ] || exit 1
            echo "::warning::release branch not moved: v$NEXT is not a fast-forward of it"
          fi
          gh release view "v$NEXT" >/dev/null 2>&1 ||
            gh release create "v$NEXT" --verify-tag --generate-notes --title "v$NEXT"

      - name: Merge the release back into nightly
        if: >-
          env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
          && env.RELEASE_KIND != 'tag' && steps.candidate.outputs.branch == 'nightly'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git fetch -q origin nightly
          if git merge-base --is-ancestor HEAD origin/nightly; then exit 0; fi
          git checkout -q -B nightly origin/nightly
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --no-ff --no-edit "v$NEXT"
          git push origin nightly

  release:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.rehearse) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    env:
      RELEASE_MODE: live
      RELEASE_KIND: ${{ github.event_name == 'schedule' && 'train' || github.event_name == 'push' && 'tag' || 'manual' }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_LEVEL: ${{ inputs.level }}
      SIBLINGS: '[]'
    defaults:
      run:
        shell: bash
        working-directory: Adapter-For-All-Agents
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Adapter-For-All-Agents
          fetch-depth: 0

      # Copied before the candidate checkout replaces the working tree, so the
      # helper always matches this workflow.
      - name: Stage the train helper
        run: cp .github/release-train.py "$RUNNER_TEMP/train.py"

      - name: Select the candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.candidate }}
        run: |
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          python3 "$RUNNER_TEMP/train.py" candidate --weekday=fri --time=23:59 \
            --utc-offset=+08:00 --default-branch="$default_branch" --override="$OVERRIDE"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install the pinned toolchain
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install
          fi

      - name: Wait for cross-repository dependencies
        id: deps
        run: python3 "$RUNNER_TEMP/train.py" deps --wait-minutes=150

      - name: Compute the release version
        id: version
        if: steps.deps.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: python3 "$RUNNER_TEMP/train.py" version --candidate="$CANDIDATE" --branch="$BRANCH"

      - name: Verify
        if: steps.version.outputs.release == 'true'
        run: |
          scripts/verify.sh

      - name: Native-capability freshness
        if: steps.version.outputs.release == 'true'
        run: python3 "$RUNNER_TEMP/train.py" freshness --window-days=14

      - name: Apply the release version
        if: steps.version.outputs.release == 'true' && steps.version.outputs.needs_set == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          cargo install cargo-edit@0.13.13 --locked --no-default-features --features set-version
          cargo set-version --workspace "$NEXT"
          cargo update --workspace

      - name: Package
        if: steps.version.outputs.release == 'true'
        env:
          EXCLUDES: ${{ steps.version.outputs.excludes }}
        run: |
          args=()
          for crate in $EXCLUDES; do args+=(--exclude "$crate"); done
          cargo publish --workspace --dry-run --allow-dirty "${args[@]}"

      - name: Promote the candidate to stable
        if: >-
          env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
          && env.RELEASE_KIND != 'tag'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git push origin "$CANDIDATE:refs/heads/stable"
          if ! git diff --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "release: v$NEXT"
          fi

      - name: Authenticate to crates.io
        id: auth
        if: env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDES: ${{ steps.version.outputs.excludes }}
        run: |
          args=()
          for crate in $EXCLUDES; do args+=(--exclude "$crate"); done
          cargo publish --workspace "${args[@]}"

      - name: Tag the release
        if: env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if [ "$RELEASE_KIND" != tag ]; then
            git tag "v$NEXT"
            git push origin "refs/tags/v$NEXT"
          fi
          if ! git push origin "HEAD:refs/heads/release"; then
            # A hand-pushed tag may sit off the release line; the upload
            # already happened, so only the branch pointer is left behind.
            [ "$RELEASE_KIND" = tag ] || exit 1
            echo "::warning::release branch not moved: v$NEXT is not a fast-forward of it"
          fi
          gh release view "v$NEXT" >/dev/null 2>&1 ||
            gh release create "v$NEXT" --verify-tag --generate-notes --title "v$NEXT"

      - name: Merge the release back into nightly
        if: >-
          env.RELEASE_MODE == 'live' && steps.version.outputs.release == 'true'
          && env.RELEASE_KIND != 'tag' && steps.candidate.outputs.branch == 'nightly'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git fetch -q origin nightly
          if git merge-base --is-ancestor HEAD origin/nightly; then exit 0; fi
          git checkout -q -B nightly origin/nightly
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --no-ff --no-edit "v$NEXT"
          git push origin nightly
