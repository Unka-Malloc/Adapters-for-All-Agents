# Generated release train for Adapter-For-All-Agents.
# Edit the release declaration and regenerate instead of changing this file
# by hand.
#
# This file holds the only job trusted with the crates.io OIDC identity.
# Registries bind trusted publishing to this filename, which is why the
# OIDC job lives here and not in the candidate-triggered `verify.yml`.
# It never runs on a candidate ref: `workflow_run` executes the default
# branch's copy of this file after the `verify` train completes, and a
# manual dispatch is confined to the default branch by the job condition
# below. The candidate supplies verified artifacts only — the workflow
# definition itself is outside its reach.
#
# `gate` downloads the verify run's `release-inputs` artifact and exposes
# its fields as job outputs. `release` then replays the already-verified
# `.crate` set: no candidate-controlled code executes under the publishing
# identity.
#
# Credentials: crates.io Trusted Publishing; no stored secret.
name: publish

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Verify-train run id to publish from
        required: true

permissions: {}

concurrency:
  group: release-train-publish
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      run_id: ${{ env.RUN_ID }}
      sha: ${{ steps.load.outputs.sha }}
      branch: ${{ steps.load.outputs.branch }}
      release: ${{ steps.load.outputs.release }}
      kind: ${{ steps.load.outputs.kind }}
      next: ${{ steps.load.outputs.next }}
      needs_set: ${{ steps.load.outputs.needs_set }}
      excludes: ${{ steps.load.outputs.excludes }}
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-inputs
          run-id: ${{ env.RUN_ID }}
          path: release-inputs

      # The inputs file is KEY=VALUE pairs written by the verify job's own
      # step outputs; it is data, never code, so sourcing it is safe.
      - id: load
        run: cat release-inputs/env >> "$GITHUB_OUTPUT"

  release:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      needs.gate.outputs.release == 'true'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    env:
      RELEASE_MODE: live
      RELEASE_KIND: ${{ needs.gate.outputs.kind }}
      SIBLINGS: '[]'
      CANDIDATE: ${{ needs.gate.outputs.sha }}
      BRANCH: ${{ needs.gate.outputs.branch }}
      NEXT: ${{ needs.gate.outputs.next }}
      NEEDS_SET: ${{ needs.gate.outputs.needs_set }}
      EXCLUDES: ${{ needs.gate.outputs.excludes }}
    defaults:
      run:
        shell: bash
        working-directory: Adapter-For-All-Agents
    steps:
      # Git refs move inside this job, so the candidate is checked out; no
      # candidate-controlled code runs here — publishing replays the verified
      # artifacts produced by the verify train.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Adapter-For-All-Agents
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-set-${{ needs.gate.outputs.sha }}
          path: release-set
          run-id: ${{ needs.gate.outputs.run_id }}

      # The version bump was authored under the read-only token; here it is
      # only a patch the release job replays onto the candidate tree.
      - name: Commit the release version
        if: env.RELEASE_KIND != 'tag' && env.NEEDS_SET == 'true'
        run: |
          git apply "$GITHUB_WORKSPACE/release-set/version-bump.patch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "release: v$NEXT"

      # HEAD already carries the version-bump commit when one was applied,
      # so promote HEAD — pushing $CANDIDATE would strand stable on the
      # pre-release commit.
      - name: Promote the candidate to stable
        if: env.RELEASE_KIND != 'tag'
        run: git push origin "HEAD:refs/heads/stable"

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The whole upload loop lives in this workflow — the only file the OIDC
      # trust is bound to. Nothing from the candidate checkout executes here:
      # the .crate payloads are data, tar extracts them, and `cargo publish
      # --no-verify` packages files without compiling or running build scripts.
      - name: Publish the verified release set to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          SET: ${{ github.workspace }}/release-set
        run: |
          index_path() {
            case ${#1} in
              1) echo "1/$1";;
              2) echo "2/$1";;
              3) echo "3/${1:0:1}/$1";;
              *) echo "${1:0:2}/${1:2:2}/$1";;
            esac
          }
          published() { curl -fsSL "https://index.crates.io/$(index_path "$1")" | grep -q "\"vers\":\"$2\""; }
          while IFS=$'\t' read -r name vers; do
            [ -n "$name" ] || continue
            if published "$name" "$vers"; then
              echo "$name $vers is already on crates.io"
              continue
            fi
            dir="$(mktemp -d)"
            tar -xzf "$SET/$name-$vers.crate" -C "$dir"
            package="$(find "$dir" -mindepth 1 -maxdepth 1 -type d)"
            rm -f "$package/Cargo.toml.orig"
            # A packaged .cargo/config.toml could name a credential
            # provider or redirect the registry: strip it and publish with
            # an isolated CARGO_HOME so no package-controlled Cargo
            # configuration executes beside the token.
            rm -rf "$package/.cargo"
            (cd "$package" && env "CARGO_HOME=$(mktemp -d)" cargo publish --no-verify --registry crates-io)
            for _ in $(seq 1 60); do
              published "$name" "$vers" && break
              sleep 10
            done
            published "$name" "$vers" || { echo "::error::crates.io index still lacks $name $vers"; exit 1; }
          done < "$SET/publish-order.txt"

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_KIND" != tag ]; then
            git tag "v$NEXT"
            git push origin "refs/tags/v$NEXT"
          fi
          if ! git push origin "HEAD:refs/heads/release"; then
            # A hand-pushed tag may sit off the release line; the upload
            # already happened, so only the branch pointer is left behind.
            [ "$RELEASE_KIND" = tag ] || exit 1
            echo "::warning::release branch not moved: v$NEXT is not a fast-forward of it"
          fi
          gh release view "v$NEXT" >/dev/null 2>&1 ||
            gh release create "v$NEXT" --verify-tag --generate-notes --title "v$NEXT"

      - name: Merge the release back into nightly
        if: >-
          env.RELEASE_KIND != 'tag' && env.BRANCH == 'nightly'
        run: |
          git fetch -q origin nightly
          if git merge-base --is-ancestor HEAD origin/nightly; then exit 0; fi
          git checkout -q -B nightly origin/nightly
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --no-ff --no-edit "v$NEXT"
          git push origin nightly
