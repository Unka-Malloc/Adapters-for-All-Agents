# crates.io publication for the a4aa workspace, gated on the same
# verification gate as local development (`scripts/verify.sh`).
#
# Trigger: push a version tag (`git tag v0.2.0 && git push origin v0.2.0`)
# after the matching Cargo.toml versions. Layers publish in dependency
# order — a4aa first, the a4aa-<agent> dialect crates next, a4aa-dialects
# last — and each layer retries until crates.io's index admits the fresh
# dependency versions.
#
# Required secret: CARGO_REGISTRY_TOKEN (crates.io API token scoped to
# the a4aa crates).
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: scripts/verify.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # crates.io's index can lag a fresh publish by tens of seconds;
          # dependents only resolve once the layer below them is visible.
          publish() {
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$1" --token "$CARGO_REGISTRY_TOKEN"; then
                return 0
              fi
              sleep 30
            done
            echo "::error::could not publish $1"
            return 1
          }
          publish a4aa
          for crate in crates/*; do
            crate="$(basename "$crate")"
            [ "$crate" = "a4aa-dialects" ] && continue
            publish "$crate"
          done
          publish a4aa-dialects
