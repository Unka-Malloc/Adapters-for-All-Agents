[package]
name = "a4aa-open-claw"
description = "a4aa dialect adapter: the `openclaw` mechanism descriptor (hooks, rules, skills, commands, subagents, plugins, permissions, MCP) for a4aa's adaptation engine."
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Adapter-For-All-Agents"
keywords = ["a4aa", "agent", "openclaw", "dialect", "profile"]
categories = ["development-tools"]

[lib]
name = "a4aa_open_claw"
path = "src/lib.rs"

[dependencies]
a4aa = { path = "../..", version = "0.3.0" }
